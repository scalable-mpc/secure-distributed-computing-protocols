[package]
name = "crypto"
version = "0.1.0"
authors = ["akhilsb <akhilsai2712@gmail.com>", "hermitsage <dth.bht@gmail.com>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# types = { package = "types", path="../types"}
# sha2 0.11 selects the SHA-256 instructions at run time on aarch64 (SHA2)
# and on x86_64 (SHA-NI), with no Cargo feature. sha2 0.9 used them on
# aarch64 only with its `asm` feature: on Apple M-series CPUs the HMAC of
# each message ran in software, at a quarter of the speed.
sha2 = "0.11.1"
hmac = "0.13.0"
serde = { version = "1.0", features = ["derive"] }
bincode = "1"
rand = "0.8.5"
aes = "0.8.3"
aes-gcm = "0.10.3"
rand_chacha = "0.3.1"
num-bigint-dig = "0.4"
num-bigint = {version = "0.2.6", features = ["rand"]}

# Polynomial Operations with FFT
lambdaworks-math = "0.11.0"

[dev-dependencies]
quickcheck = "1"
criterion = { version = "0.2", features = ["html_reports"] }

[[bench]]
name="hardware_accelerated_hash"
harness= false

[[bench]]
name="hash_func_performance_message_sizes"
harness= false