[workspace]

[package]
name = "gf16_vs_prime"
version = "0.1.0"
authors = ["akhilsb <akhilsai2712@gmail.com>"]
edition = "2021"
publish = false

# Independent workspace + pinned toolchain, same reasoning as ../rs_bench.

[dependencies]
# The GF(2^16) side under test: commonware vendors `reed-solomon-simd`
# (Leopard-RS) here and exposes its `Engine` trait publicly, so the exact
# kernel commonware runs can be benchmarked directly rather than reimplemented.
commonware-cryptography = "2026.7.0"

[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports"] }

[[bench]]
name = "kernel"
harness = false

[[bench]]
name = "crossover"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[[bench]]
name = "decode"
harness = false
