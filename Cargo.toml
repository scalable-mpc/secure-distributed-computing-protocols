[workspace]
# This should only list projects that are not
# in the dependency tree in any other way
members = [
    "types",
    "config",
    "broadcast",
    "crypto",
    "tools/genconfig",
    "consensus",
    # "comm", (WIP: Do not enable unless testing)
    # RBC module
    "node",
    # Not reachable from `node`, but listed so that `cargo check --workspace`
    # keeps them compiling. Both were unbuildable before the commonware switch
    # (`avid` never declared its `consensus` dependency and `ecc_rbc` pointed at
    # the wrong path for it), so nothing caught them drifting.
    "dissemination/avid",
    "broadcast/ecc_rbc"
]
